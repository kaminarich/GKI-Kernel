name: Build GKI 5.15 (Fix task_mmu)

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target Version (Commit Hash / Tag)'
        default: 'android13-5.15'
        required: true
      kernel_name:
        description: 'Kernel Name (Optional)'
        required: false
        default: ''

jobs:
  build:
    name: Build Kernel 5.15
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl build-essential bc bison flex libssl-dev \
            libelf-dev libncurses-dev lld python3
          
          # Setup Git Config untuk commit otomatis saat patching
          git config --global user.name "Bot"
          git config --global user.email "bot@example.com"

      - name: Clone Kernel Source (Android13-5.15)
        run: |
          echo "Cloning GKI Source (Branch: android13-5.15)..."
          git clone https://android.googlesource.com/kernel/common -b android13-5.15 --depth 1 source
          cd source
          git fetch --unshallow || true

      - name: Setup Clang 19 (User Requested)
        run: |
          echo "Setting up Clang-19 (r536225)..."
          mkdir -p toolchain/clang
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          curl -L "${CLANG_URL}" | tar -xz -C toolchain/clang

      - name: Checkout Target Version
        run: |
          cd source
          TARGET="${{ github.event.inputs.target_version }}"
          echo "Checking out: $TARGET"
          git checkout $TARGET || echo "Target hash not found, using latest commit."

      - name: Apply SukiSU & SUSFS Patches (Android 13)
        run: |
          cd source
          echo "Downloading SukiSU Setup..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          
          echo "Cloning SUSFS Patches (Branch: gki-android13-5.15)..."
          git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android13-5.15 sus_temp
          
          cp -r sus_temp/kernel_patches/fs/* fs/
          cp -r sus_temp/kernel_patches/include/* include/
          cp sus_temp/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch .
          
          echo "Applying SUSFS Patch..."
          patch -p1 < 50_add_susfs_in_gki-android13-5.15.patch
          rm -rf sus_temp

      - name: Fix task_mmu.c (Advanced Fix)
        run: |
          cd source
          echo "Fixing task_mmu.c logic..."
          FILE="fs/proc/task_mmu.c"
          TMP="/tmp/task_mmu_fix.$$"
          
          # 1. Hapus jika ada show_pad di baris 1 (Fix error sebelumnya)
          sed -i '1{/^show_pad:/d}' "$FILE"
          
          # 2. Coba hapus blok goto show_pad jika ada logic conflict
          awk '
            BEGIN { in=0; buf="" }
            {
              if ($0 ~ /^#ifdef[[:space:]]+CONFIG_KSU_SUSFS_SUS_MAP/) {
                in=1; buf=$0 "\n"; next
              }
              if (in) {
                buf = buf $0 "\n"
                if ($0 ~ /^#endif/) {
                  if (buf ~ /goto[[:space:]]+show_pad/) {
                    in=0; buf=""
                    next
                  } else {
                    printf "%s", buf
                    in=0; buf=""
                    next
                  }
                }
                next
              }
              print
            }
          ' "$FILE" > "$TMP" && mv "$TMP" "$FILE"
          
          # 3. Masukkan label show_pad: di tempat yang BENAR (di dalam fungsi)
          if ! grep -q '^show_pad:$' "$FILE"; then
            if grep -q 'show_map_pad_vma' "$FILE"; then
              # Masukkan sebelum show_map_pad_vma (paling aman)
              LINE=$(grep -n 'show_map_pad_vma' "$FILE" | head -n1 | cut -d: -f1)
              sed -i "${LINE}ishow_pad:" "$FILE"
              echo "Injecting show_pad before show_map_pad_vma at line $LINE"
            elif grep -q 'SEQ_PUT_DEC(\"Size:' "$FILE"; then
              LINE=$(grep -n 'SEQ_PUT_DEC(\"Size:' "$FILE" | head -n1 | cut -d: -f1)
              sed -i "${LINE}ishow_pad:" "$FILE"
              echo "Injecting show_pad before SEQ_PUT_DEC at line $LINE"
            else
              echo "WARNING: Could not find good place for show_pad, skipping injection."
            fi
          fi
          
          git add "$FILE"
          git commit -m "Auto-fix show_pad logic" || true

      - name: Configure Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH
          export ARCH=arm64
          export LLVM=1
          
          cd source
          
          echo "Generating GKI Defconfig..."
          make O=out gki_defconfig
          
          echo "Modifying Config..."
          scripts/config --file out/.config \
            -e LTO_CLANG \
            -d LTO_NONE \
            -e LTO_CLANG_THIN \
            -d LTO_CLANG_FULL \
            -e THINLTO \
            -e KPM \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT
            
          scripts/config --file out/.config --set-val CONFIG_HZ 300
          
          NAME="${{ github.event.inputs.kernel_name }}"
          if [ ! -z "$NAME" ]; then
             sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -$NAME/" Makefile
          fi

      - name: Build Kernel Image
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH
          export ARCH=arm64
          export LLVM=1
          
          cd source
          echo "Building Image using Clang 19..."
          
          # Tambahkan NOWERROR=1 untuk mengabaikan warning kecil dari Clang 19
          make -j$(nproc --all) \
              O=out \
              CC=clang \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              NOWERROR=1 \
              Image

      - name: Apply KPM Binary Patch
        run: |
          cd source/out/arch/arm64/boot
          
          if [ ! -f Image ]; then
             echo "::error::Build Failed! Image not found."
             exit 1
          fi
          
          echo "Applying KPM Patch..."
          curl -LSs "https://github.com/SukiSU-Ultra/SukiSU_patch/raw/refs/heads/main/kpm/patch_linux" -o patch
          chmod +x patch
          ./patch
          
          if [ -f oImage ]; then
             mv -f oImage Image
             echo "KPM Patch Applied Successfully."
          else
             echo "::error::KPM Patch Failed (oImage not created)."
             exit 1
          fi

      - name: Upload Image to PixelDrain
        run: |
          cd source/out/arch/arm64/boot
          echo "Uploading Image to PixelDrain..."
          curl -T Image -u :23c84c82-ce06-4e35-bc1f-69eaa13b9958 https://pixeldrain.com/api/file
