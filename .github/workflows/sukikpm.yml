name: Suki KPM

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target Linux Version (Commit Message)'
        default: 'Linux 5.10.233'
        required: true

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Setup git identity
        run: |
          git config --global user.name "kaminari"
          git config --global user.email "itawanri14@gmail.com"

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld

      - name: Create and Init GKI Source
        run: |
          mkdir gki && cd gki
          # Depth=1 dihapus agar kita bisa mencari commit history (versi linux)
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc --all)

      - name: Checkout Specific Kernel Version
        run: |
          cd gki/common
          TARGET_VERSION="${{ github.event.inputs.target_version }}"
          
          echo "Preparing to checkout: $TARGET_VERSION"
          
          # Bersihkan state git sebelum mencari commit
          git reset --hard
          git clean -fd
          
          echo "Searching for commit hash..."
          CHECKOUT_COMMIT=$(git log -1 --format=%H --grep="$TARGET_VERSION")
          
          if [ -z "$CHECKOUT_COMMIT" ]; then
            echo "WARNING: Version '$TARGET_VERSION' not found in git history!"
            echo "Falling back to latest commit."
          else
            echo "Found commit: $CHECKOUT_COMMIT"
            git checkout $CHECKOUT_COMMIT
            echo "Successfully checked out to $TARGET_VERSION"
          fi

      - name: Delete Line 2 in build.config.gki
        run: |
          sed -i '2d' gki/common/build.config.gki

      - name: Apply SukiSU Patch
        run: |
          cd gki/common
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
          rm -rf sus/.git
          susfs=sus/kernel_patches
          cp -r $susfs/fs .
          cp -r $susfs/include .
          cp -r $susfs/50_add_susfs_in_gki-android12-5.10.patch .
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Fix KernelSU and sus directory state
        run: |
          cd gki/common
          # Hapus folder .git agar tidak dianggap sebagai submodule
          rm -rf KernelSU/.git
          rm -rf sus/.git
          
          # Gunakan --ignore-unmatch agar tidak error false alarm di log
          git rm --cached --ignore-unmatch -r KernelSU
          git rm --cached --ignore-unmatch -r sus
          
          # Tambahkan kembali sebagai file biasa
          git add KernelSU
          git add sus
          git commit -m "Inject KernelSU & SUSFS manually" || true

      - name: Add Custom Network & FS Configs
        run: |
          # Set path ke file config
          DEFCONFIG="gki/common/arch/arm64/configs/gki_defconfig"
          
          echo "Injecting custom configs to $DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $DEFCONFIG 
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_BIC=n" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_HTCP=n" >> $DEFCONFIG 
          echo "CONFIG_DEFAULT_BBR=y" >> $DEFCONFIG

      - name: Append CONFIG_HZ_300 to defconfig
        run: |
          echo -e '\nCONFIG_HZ_300=y\nCONFIG_HZ=300' >> gki/common/arch/arm64/configs/gki_defconfig

      - name: Final Clean Tree Commit
        run: |
          cd gki/common
          git add .
          git commit -m "Final clean tree before build" || true

      - name: Build Kernel
        run: |
          cd gki
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Apply KPM Patch
        run: |
          # Masuk ke folder output dimana Image berada
          cd gki/out/android12-5.10/common/arch/arm64/boot/
          
          if [ -f Image ]; then
            echo "Image found, applying KPM patch..."
            
            # Download dan jalankan patcher
            curl -LSs "https://github.com/SukiSU-Ultra/SukiSU_patch/raw/refs/heads/main/kpm/patch_linux" -o patch
            chmod 777 patch
            ./patch
            
            # Rename hasil patch (oImage) menjadi Image kembali agar terupload
            if [ -f oImage ]; then
              mv -f oImage Image
              echo "KPM Patch applied successfully."
              ls -lh Image
            else
              echo "Error: oImage not found after patching!"
              exit 1
            fi
            
          else
            echo "Image file not found. Skipping KPM patch."
          fi

      - name: Upload Image to PixelDrain
        if: always() 
        run: |
          if [ -f gki/out/android12-5.10/common/arch/arm64/boot/Image ]; then
            curl -u :23c84c82-ce06-4e35-bc1f-69eaa13b9958 \
              -F file=@gki/out/android12-5.10/common/arch/arm64/boot/Image \
              https://pixeldrain.com/api/file
          else
            echo "Image file not found. Build likely failed."
          fi
