name: KowSU Builder (AOSP + Clang 19/20)

on:
  workflow_dispatch:
    inputs:
      clang_version:
        description: 'Pilih Versi Clang'
        required: true
        default: 'r536225 (Clang 19)'
        type: choice
        options:
        - 'r536225 (Clang 19)'
        - 'r547379 (Clang 20)'
      target_version:
        description: 'Target Linux Version (Cth: Linux 5.10.246)'
        default: 'Linux 5.10.246'
        required: true
      kernel_name:
        description: 'Nama Kernel (Kosongkan = Default)'
        required: false
        default: 'KowSU'

jobs:
  build:
    name: Build KowSU - ${{ github.event.inputs.target_version }}
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup Git Identity
        run: |
          git config --global user.name "kaminari"
          git config --global user.email "itawanri14@gmail.com"

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld ccache \
            cmake ninja-build

      # --- SETUP CLANG (AOSP) ---
      - name: Setup Custom Clang
        run: |
          mkdir -p gki/prebuilts-master/clang/host/linux-x86
          
          if [ "${{ github.event.inputs.clang_version }}" == "r536225 (Clang 19)" ]; then
            echo "Setting up Clang-19 (r536225)..."
            CLANG_VER="clang-r536225"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          else
            echo "Setting up Clang-20 (r547379)..."
            CLANG_VER="clang-r547379"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/62cdcefa89e31af2d72c366e8b5ef8db84caea62/clang-r547379.tar.gz"
          fi
          
          mkdir -p gki/prebuilts-master/clang/host/linux-x86/$CLANG_VER
          cd gki/prebuilts-master/clang/host/linux-x86
          
          echo "Downloading $CLANG_VER..."
          curl -L "${CLANG_URL}" | tar -xz -C $CLANG_VER
          
          # Symlink ke default path
          ln -sf $CLANG_VER clang-r416183b

      # --- INIT SOURCE (MURNI AOSP) ---
      - name: Init Source
        run: |
          mkdir -p gki
          cd gki
          # Repo init ke Google Source (Clean)
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Checkout Specific Kernel Version
        run: |
          cd gki/common
          TARGET_VERSION="${{ github.event.inputs.target_version }}"
          
          # Cari commit di history AOSP
          CHECKOUT_COMMIT=$(git log --all --format=%H --grep="$TARGET_VERSION" | head -n 1)
          
          if [ -z "$CHECKOUT_COMMIT" ]; then
            echo "WARNING: Version '$TARGET_VERSION' not found. Using latest HEAD."
          else
            echo "Found commit: $CHECKOUT_COMMIT"
            git checkout $CHECKOUT_COMMIT
          fi

      - name: Delete Line 2 in build.config.gki
        run: |
          sed -i '2d' gki/common/build.config.gki

      # --- SETUP KOWSU (KERNELSU-NEXT) ---
      - name: Setup KowSU
        run: |
          cd gki/common
          echo "Cloning KernelSU-Next..."
          rm -rf drivers/staging/kernelsu
          git clone https://github.com/ramabondanp/KernelSU.git -b main drivers/staging/kernelsu

      # --- CHERRY-PICK & FIXES ---
      - name: Apply Cherry-picks & Fixes
        run: |
          cd gki/common
          echo "Applying requested cherry-picks..."
          
          # Fix Task MMU
          curl -LSs "https://github.com/ramabondanp/android_kernel_common-5.10/commit/4fe04b60009e.patch" | git am -3 || echo "CP 1 Skipped"
          
          # Fix Setlocalversion
          curl -LSs "https://github.com/Pzqqt/android_kernel_xiaomi_marble/commit/477706c2bcaaf48350c61f9f6824e1e454617147.patch" | git am -3 || echo "CP 2 Skipped"

          # Fix Xiaomi Compatibility
          sed -i '/pr_warn.*disagrees about version of symbol.*/,+1 s/.*/return 1;/' kernel/module.c
          sed -i '/^static int drm_atomic_check_valid_clones/,/^}/d' drivers/gpu/drm/drm_atomic_helper.c
          sed -i '/ret = drm_atomic_check_valid_clones/,/return ret;/d' drivers/gpu/drm/drm_atomic_helper.c

      # --- INJECT CONFIG KOWSU ---
      - name: Inject Defconfig
        run: |
          cd gki/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          echo "Injecting KowSU & Performance Configs..."
          cat <<EOF >> "$DEFCONFIG"
          # KernelSU Configuration
          CONFIG_KSU=y
          CONFIG_KPM=n
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_KPROBES_HOOK=n
          
          # SUSFS Configuration
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_SPOOF_GENERIC=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          
          # Performance & Network
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_HZ_500=y
          CONFIG_CPU_FREQ=y
          CONFIG_HIGH_RES_TIMERS=y
          CONFIG_CLEANCACHE=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_IP_NF_TARGET_TTL=y
          
          # Filesystem
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: Configure Kernel Name & Clang
        run: |
          cd gki
          
          # --- Set Kernel Name ---
          if [ -n "${{ github.event.inputs.kernel_name }}" ]; then
             echo "Custom Name: ${{ github.event.inputs.kernel_name }}"
             echo "EXTRAVERSION = -${{ github.event.inputs.kernel_name }}" >> common/Makefile
             
             # Hapus config lama dan set baru
             sed -i '/^CONFIG_LOCALVERSION=/d' common/arch/arm64/configs/gki_defconfig
             echo 'CONFIG_LOCALVERSION="-${{ github.event.inputs.kernel_name }}"' >> common/arch/arm64/configs/gki_defconfig
             echo 'CONFIG_LOCALVERSION_AUTO=n' >> common/arch/arm64/configs/gki_defconfig
          fi

          # --- Set Clang in Build Config ---
          if [ "${{ github.event.inputs.clang_version }}" == "r536225 (Clang 19)" ]; then
             SELECTED_CLANG="clang-r536225"
          else
             SELECTED_CLANG="clang-r547379"
          fi
          
          # Hack build.config agar pakai Clang yg sudah didownload
          sed -i "s/clang-r[0-9]*[a-z]*/$SELECTED_CLANG/g" common/build.config.gki.aarch64
          sed -i "s/clang-r[0-9]*[a-z]*/$SELECTED_CLANG/g" common/build.config.common 2>/dev/null || true
          sed -i 's/check_defconfig//' common/build.config.gki

      - name: Build Kernel
        run: |
          cd gki
          export CC="ccache clang"
          export USE_CCACHE=1
          export CCACHE_DIR="/tmp/ccache"
          ccache -M 5G
          
          # Build Thin LTO
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Upload Image
        if: always() 
        run: |
          if [ -f gki/out/android12-5.10/common/arch/arm64/boot/Image ]; then
            echo "Uploading Image..."
            curl -u :23c84c82-ce06-4e35-bc1f-69eaa13b9958 \
              -F file=@gki/out/android12-5.10/common/arch/arm64/boot/Image \
              -F file_name="Image-KowSU-${{ github.event.inputs.kernel_name }}" \
              https://pixeldrain.com/api/file
          else
            echo "Build failed. Image not found."
            exit 1
          fi
