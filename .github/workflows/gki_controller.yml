name: GKI Kernel Builder

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Android Kernel Version'
        required: true
        default: '5.10'
        type: choice
        options:
          - '5.10'
          - '6.1'
          - '6.6'
      ksu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'standard'
          - 'susfs'
          - 'resukisu'
      upload_artifacts:
        description: 'Upload Build Artifacts'
        required: true
        type: boolean
        default: true

jobs:
  build_process:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf \
          liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          python3-pip python3-lxml
          
      - name: Execute Build Script
        run: |
          chmod +x scripts/runner.sh
          chmod +x scripts/abi_audit.py
          ./scripts/runner.sh
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload Image
        if: inputs.upload_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ inputs.kernel_version }}-${{ inputs.ksu_variant }}
          path: out/arch/arm64/boot/Image
          
      - name: Upload ABI Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abi_report
          path: out/abi_report.txt
