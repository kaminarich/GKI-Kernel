name: 2 Suki Latest

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Custom Kernel Name'
        required: false
        default: ''
        type: string
      clang_version:
        description: 'Clang Version'
        required: true
        type: choice
        options:
          - 'r536225 (Clang 19)'
          - 'r547379 (Clang 20)'

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Cleanup & Optimize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "kaminari"
          git config --global user.email "itawanri14@gmail.com"

      - name: Install Tools
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld

      - name: Download Source (GKI 5.10)
        run: |
          mkdir gki && cd gki
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc --all)

      - name: Patch Rama (881fa16)
        working-directory: gki/common
        run: |
          curl -L "https://github.com/ramabondanp/android_kernel_common-5.10/commit/881fa16.patch" -o rama.patch
          if ! git am -3 < rama.patch; then
            git am --abort
            patch -p1 --fuzz=3 < rama.patch || true
          fi
          rm rama.patch

      - name: Clean build.config
        run: sed -i '2d' gki/common/build.config.gki

      - name: Install SukiSU & SUSFS
        working-directory: gki/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
          rm -rf sus/.git
          cp -r sus/kernel_patches/fs .
          cp -r sus/kernel_patches/include .
          cp -r sus/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch .
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Cherry-pick Common Fixes
        working-directory: gki/common
        run: |
          curl -L "https://github.com/ramabondanp/android_kernel_common-5.10/commit/4fe04b60009e.patch" | git am -3 || {
             curl -L "https://github.com/ramabondanp/android_kernel_common-5.10/commit/4fe04b60009e.patch" | patch -p1
          }

      - name: Fix Stack Protector
        working-directory: gki/common
        run: |
          sed -i '/config STACKPROTECTOR_PER_TASK/{n;s/def_bool y/bool "Stack Protector per task"\n\tdefault y/;}' arch/arm64/Kconfig
          echo "# CONFIG_STACKPROTECTOR_PER_TASK is not set" >> arch/arm64/configs/gki_defconfig

      - name: Fix DRM & Module Checks
        working-directory: gki
        run: |
          sed -i '/pr_warn.*disagrees about version of symbol.*/,+1 s/.*/return 1;/' common/kernel/module.c
          sed -i '/^static int drm_atomic_check_valid_clones/,/^}/d' common/drivers/gpu/drm/drm_atomic_helper.c
          sed -i '/ret = drm_atomic_check_valid_clones/,/return ret;/d' common/drivers/gpu/drm/drm_atomic_helper.c
          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Commit External Modules
        working-directory: gki/common
        run: |
          rm -rf KernelSU/.git sus/.git
          git rm --cached --ignore-unmatch -r KernelSU sus
          git add KernelSU sus
          git commit -m "Inject KernelSU & SUSFS" || true

      - name: Apply Defconfigs (KSU/SUSFS/Net)
        run: |
          DEFCONFIG="gki/common/arch/arm64/configs/gki_defconfig"
          
          # KSU & KPM
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPM=y" >> $DEFCONFIG

          # SUSFS (Crucial)
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG

          # Net & FS
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $DEFCONFIG 
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG
          echo "CONFIG_DEFAULT_BBR=y" >> $DEFCONFIG
          
          # HZ
          echo -e '\nCONFIG_HZ_300=y\nCONFIG_HZ=300' >> $DEFCONFIG

      - name: Set Kernel Version
        working-directory: gki/common
        run: |
          KERNEL_NAME="${{ github.event.inputs.kernel_name }}"
          [ -n "$KERNEL_NAME" ] && sed -i "s/^EXTRAVERSION *=.*/EXTRAVERSION = -$KERNEL_NAME/" Makefile || true

      - name: Setup Clang
        working-directory: gki
        run: |
          mkdir -p prebuilts-master/clang/host/linux-x86
          if [ "${{ github.event.inputs.clang_version }}" == "r536225 (Clang 19)" ]; then
            CLANG_VER="clang-r536225"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          else
            CLANG_VER="clang-r547379"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/62cdcefa89e31af2d72c366e8b5ef8db84caea62/clang-r547379.tar.gz"
          fi
          
          mkdir -p prebuilts-master/clang/host/linux-x86/$CLANG_VER
          curl -L "${CLANG_URL}" | tar -xz -C prebuilts-master/clang/host/linux-x86/$CLANG_VER
          ln -sf $CLANG_VER prebuilts-master/clang/host/linux-x86/clang-r416183b

      - name: Save Source State
        working-directory: gki/common
        run: git commit -am "Pre-build snapshot" || true

      - name: Build Image
        working-directory: gki
        run: LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Patch Image (KPM)
        working-directory: gki/out/android12-5.10/common/arch/arm64/boot/
        run: |
          if [ -f Image ]; then
            curl -LSs "https://github.com/SukiSU-Ultra/SukiSU_patch/raw/refs/heads/main/kpm/patch_linux" -o patch
            chmod +x patch && ./patch
            [ -f oImage ] && mv -f oImage Image || exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aetherium-Kernel-Image
          path: gki/out/android12-5.10/common/arch/arm64/boot/Image
          if-no-files-found: warn

      - name: Mirror to PixelDrain
        if: always() 
        run: |
          [ -f gki/out/android12-5.10/common/arch/arm64/boot/Image ] && \
          curl -u :23c84c82-ce06-4e35-bc1f-69eaa13b9958 \
          -F file=@gki/out/android12-5.10/common/arch/arm64/boot/Image \
          https://pixeldrain.com/api/file || echo "Build failed, skipping upload"
