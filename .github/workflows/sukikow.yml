Name: GKI Final Builder (SukiSU/KowSU Strict)

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'Pilih Varian KSU'
        required: true
        default: 'SukiSU'
        type: choice
        options:
        - SukiSU
        - KowSU
      clang_version:
        description: 'Pilih Versi Clang'
        required: true
        default: 'r530567 (Clang 19)'
        type: choice
        options:
        - 'r530567 (Clang 19)'
        - 'r547379 (Clang 20)'
      target_version:
        description: 'Target Linux Version (Cth: Linux 5.10.233)'
        default: 'Linux 5.10.233'
        required: true
      kernel_name:
        description: 'Nama Kernel'
        required: true
        default: 'Suki-KowSU'

jobs:
  build:
    name: Build ${{ github.event.inputs.ksu_variant }}
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup Git Identity
        run: |
          git config --global user.name "kaminari"
          git config --global user.email "itawanri14@gmail.com"

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld ccache \
            cmake ninja-build

      # --- SETUP CLANG (Pilihan 19/20) ---
      - name: Setup Custom Clang
        run: |
          if [ "${{ github.event.inputs.clang_version }}" == "r530567 (Clang 19)" ]; then
            CLANG_VER="clang-r530567"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2024/clang-r530567.tar.gz"
          else
            CLANG_VER="clang-r547379"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/62cdcefa89e31af2d72c366e8b5ef8db84caea62/clang-r547379.tar.gz"
          fi
          
          mkdir -p gki/prebuilts-master/clang/host/linux-x86/$CLANG_VER
          cd gki/prebuilts-master/clang/host/linux-x86
          curl -L "$CLANG_URL" | tar -xz -C $CLANG_VER
          ln -sf $CLANG_VER clang-r416183b

      # --- INIT SOURCE ---
      - name: Init Source & Fetch Upstream
        run: |
          mkdir -p gki
          cd gki
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c -j$(nproc --all) --no-tags --fail-fast
          
          cd common
          git remote add rama https://github.com/ramabondanp/android_kernel_common-5.10.git
          git fetch rama

      - name: Checkout Specific Kernel Version
        run: |
          cd gki/common
          TARGET_VERSION="${{ github.event.inputs.target_version }}"
          CHECKOUT_COMMIT=$(git log --all --format=%H --grep="$TARGET_VERSION" | head -n 1)
          
          if [ -z "$CHECKOUT_COMMIT" ]; then
            echo "WARNING: Version '$TARGET_VERSION' not found! Using latest HEAD."
          else
            echo "Found commit: $CHECKOUT_COMMIT"
            git checkout $CHECKOUT_COMMIT
          fi

      - name: Delete Line 2 in build.config.gki
        run: |
          sed -i '2d' gki/common/build.config.gki

      # ==========================================
      #          SETUP SOURCE (VARIANT)
      # ==========================================

      - name: Setup SukiSU (Script & Patch)
        if: ${{ github.event.inputs.ksu_variant == 'SukiSU' }}
        run: |
          cd gki/common
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
          
          rm -rf sus/.git
          cp -r sus/kernel_patches/fs .
          cp -r sus/kernel_patches/include .
          cp sus/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch .
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Setup KowSU (Manual Clone)
        if: ${{ github.event.inputs.ksu_variant == 'KowSU' }}
        run: |
          cd gki/common
          rm -rf drivers/staging/kernelsu
          git clone https://github.com/ramabondanp/KernelSU.git -b main drivers/staging/kernelsu

      # ==========================================
      #       CHERRY-PICK & FIXES (Global)
      # ==========================================

      - name: Apply Cherry-picks
        run: |
          cd gki/common
          echo "Applying additional cherry-picks..."
          curl -LSs "https://github.com/ramabondanp/android_kernel_common-5.10/commit/4fe04b60009e.patch" | git am -3
          curl -LSs "https://github.com/Pzqqt/android_kernel_xiaomi_marble/commit/477706c2bcaaf48350c61f9f6824e1e454617147.patch" | git am -3

      - name: Fix KernelSU/SUS state
        if: ${{ github.event.inputs.ksu_variant == 'SukiSU' }}
        run: |
          cd gki/common
          rm -rf KernelSU/.git
          rm -rf sus/.git
          git rm --cached --ignore-unmatch -r KernelSU
          git rm --cached --ignore-unmatch -r sus
          git add KernelSU
          git add sus
          git commit -m "Inject KernelSU & SUSFS manually" || true

      - name: Fix task_mmu.c (Advanced Fix)
        run: |
          cd gki/common
          FILE="fs/proc/task_mmu.c"
          TMP="/tmp/task_mmu_fix.$$"
          
          sed -i '1{/^show_pad:/d}' "$FILE"
          awk 'BEGIN { in=0; buf="" } { if ($0 ~ /^#ifdef[[:space:]]+CONFIG_KSU_SUSFS_SUS_MAP/) { in=1; buf=$0 "\n"; next } if (in) { buf = buf $0 "\n"; if ($0 ~ /^#endif/) { if (buf ~ /goto[[:space:]]+show_pad/) { in=0; buf=""; next } else { printf "%s", buf; in=0; buf=""; next } } next } print }' "$FILE" > "$TMP" && mv "$TMP" "$FILE"
          
          count=$(grep -c '^show_pad:$' "$FILE" || true)
          if [ "$count" -gt 1 ]; then
            last_ln=$(grep -n '^show_pad:$' "$FILE" | tail -n1 | cut -d: -f1)
            awk -v keep="$last_ln" 'NR==keep { print; next } /^show_pad:$/ { next } { print }' "$FILE" > "$TMP" && mv "$TMP" "$FILE"
          fi
          
          if ! grep -q '^show_pad:$' "$FILE"; then
            if grep -q 'show_map_pad_vma' "$FILE"; then
              LINE=$(grep -n 'show_map_pad_vma' "$FILE" | head -n1 | cut -d: -f1)
              sed -i "${LINE}ishow_pad:" "$FILE"
            elif grep -q 'SEQ_PUT_DEC(\"Size:' "$FILE"; then
              LINE=$(grep -n 'SEQ_PUT_DEC(\"Size:' "$FILE" | head -n1 | cut -d: -f1)
              sed -i "${LINE}ishow_pad:" "$FILE"
            else
              sed -i '1ishow_pad:' "$FILE"
            fi
          fi

      # ==========================================
      #        LOGIC PEMISAH CONFIG (TEGAS)
      # ==========================================
      
      - name: Inject Configs (Strict Separation)
        run: |
          cd gki/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          # --- OPSI 1: CONFIG KHUSUS SUKISU ---
          # Sesuai request: Network, TCP, UCLAMP, dan KPM=y.
          # TIDAK ADA config susfs manual yang panjang.
          if [ "${{ github.event.inputs.ksu_variant }}" == "SukiSU" ]; then
             echo ">>> Injecting SukiSU Configs..."
             cat <<EOF >> "$DEFCONFIG"
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_BBR=y
          CONFIG_KPM=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_SCHEDTUNE=y
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_BUCKETS_COUNT=20
          CONFIG_HZ_300=y
          CONFIG_HZ=300
          EOF
          fi

          # --- OPSI 2: CONFIG KHUSUS KOWSU ---
          # KPM=n, KSU=y, dan Config Stealth Manual (Karena KowSU clone manual belum punya ini)
          if [ "${{ github.event.inputs.ksu_variant }}" == "KowSU" ]; then
             echo ">>> Injecting KowSU Configs..."
             cat <<EOF >> "$DEFCONFIG"
          CONFIG_KSU=y
          CONFIG_KPM=n
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_SPOOF_GENERIC=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_IP_NF_TARGET_TTL=y
          EOF
          fi

      - name: Set Local Version & Build Config
        run: |
          cd gki
          # Nama Kernel
          echo "" > common/scripts/setlocalversion
          chmod +x common/scripts/setlocalversion
          
          if [ -n "${{ github.event.inputs.kernel_name }}" ]; then
             echo "EXTRAVERSION = -${{ github.event.inputs.kernel_name }}" >> common/Makefile
          fi

          # Clang Version Replacement
          if [ "${{ github.event.inputs.clang_version }}" == "r530567 (Clang 19)" ]; then
             SELECTED_CLANG="clang-r530567"
          else
             SELECTED_CLANG="clang-r547379"
          fi
          
          sed -i "s/clang-r[0-9]*[a-z]*/$SELECTED_CLANG/g" common/build.config.gki.aarch64
          sed -i "s/clang-r[0-9]*[a-z]*/$SELECTED_CLANG/g" common/build.config.common 2>/dev/null || true
          sed -i 's/check_defconfig//' common/build.config.gki

      - name: Build Kernel
        run: |
          cd gki
          export CC="ccache clang"
          export USE_CCACHE=1
          export CCACHE_DIR="/tmp/ccache"
          ccache -M 5G
          
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Apply KPM Patch (SukiSU Only)
        if: ${{ github.event.inputs.ksu_variant == 'SukiSU' }}
        run: |
          cd gki/out/android12-5.10/common/arch/arm64/boot/
          if [ -f Image ]; then
            echo "Applying KPM Patch..."
            curl -LSs "https://github.com/SukiSU-Ultra/SukiSU_patch/raw/refs/heads/main/kpm/patch_linux" -o patch
            chmod 777 patch
            ./patch
            [ -f oImage ] && mv -f oImage Image
          fi

      - name: Upload Image
        if: always() 
        run: |
          if [ -f gki/out/android12-5.10/common/arch/arm64/boot/Image ]; then
            echo "Uploading Image..."
            curl -u :23c84c82-ce06-4e35-bc1f-69eaa13b9958 \
              -F file=@gki/out/android12-5.10/common/arch/arm64/boot/Image \
              -F file_name="Image-${{ github.event.inputs.ksu_variant }}-${{ github.event.inputs.kernel_name }}" \
              https://pixeldrain.com/api/file
          else
            echo "Build failed. Image not found."
            exit 1
          fi
