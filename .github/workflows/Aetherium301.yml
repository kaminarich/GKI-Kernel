name: Build GKI Suki v3.1.8 (Manual Injection)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Setup git identity
        run: |
          git config --global user.name "kaminari"
          git config --global user.email "itawanri14@gmail.com"

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld

      - name: Create and Init GKI Source (Shallow)
        run: |
          mkdir gki && cd gki
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc --all)

      - name: Delete Line 2 in build.config.gki
        run: |
          sed -i '2d' gki/common/build.config.gki

      - name: Inject SukiSU v3.1.8 (MANUAL LOCK)
        run: |
          cd gki/common
          
          # 1. Clone SukiSU
          echo "=== Cloning SukiSU ==="
          rm -rf KernelSU
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra KernelSU
          
          # 2. Checkout v3.1.8 & HAPUS Git (Supaya gak bisa update otomatis)
          cd KernelSU
          echo "=== Locking Version v3.1.8 ==="
          git checkout v3.1.8
          rm -rf .git 
          cd ..
          
          # 3. Pasang Manual (Pengganti setup.sh)
          echo "=== Manual Symlink & Injection ==="
          # Buat shortcut folder
          ln -sf ../KernelSU/kernel drivers/kernelsu
          
          # Masukkan ke drivers/Makefile
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          # Masukkan ke drivers/Kconfig (sebelum endmenu terakhir)
          if ! grep -q "kernelsu" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          
          echo "SukiSU v3.1.8 Successfully Locked!"

      - name: Apply SUSFS Patch (Branch Legacy)
        run: |
          cd gki/common
          
          # 1. Clone SUSFS Branch Lama (Kompatibel dengan v3.1.8)
          echo "=== Cloning SUSFS ==="
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 sus
          
          # 2. Copy File SUSFS
          echo "=== Copying SUSFS Files ==="
          cp -r sus/kernel_patches/fs/* fs/
          cp -r sus/kernel_patches/include/linux/* include/linux/
          
          # 3. Apply Patch
          echo "=== Applying Patch ==="
          cp sus/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch .
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Fix Directory State
        run: |
          cd gki/common
          # Hapus folder sisa clone
          rm -rf sus
          # Commit manual injection agar build system mendeteksinya
          git add .
          git commit -m "Manual Injection: SukiSU v3.1.8 + SUSFS" || true

      - name: Apply Cherry-pick from Pzqqt
        run: |
          cd gki/common
          curl -L https://github.com/Pzqqt/android_kernel_xiaomi_marble/commit/477706c2bcaaf48350c61f9f6824e1e454617147.patch > custom_cherrypick.patch
          git apply -v custom_cherrypick.patch
          rm custom_cherrypick.patch
          git add .
          git commit -m "Apply cherry-pick: 477706c" || true

      - name: Add Custom Network & FS Configs (+ Enable SUSFS)
        run: |
          DEFCONFIG="gki/common/arch/arm64/configs/gki_defconfig"
          
          echo "Injecting custom configs to $DEFCONFIG"
          
          # === Wajib: Enable SUSFS ===
          # Tanpa ini fitur SUSFS tidak akan aktif walau sudah di-patch
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
          
          # Config Tambahan Lainnya
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $DEFCONFIG 
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_BIC=n" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_HTCP=n" >> $DEFCONFIG 
          echo "CONFIG_DEFAULT_BBR=y" >> $DEFCONFIG

      - name: Append CONFIG_HZ_300 to defconfig
        run: |
          echo -e '\nCONFIG_HZ_300=y\nCONFIG_HZ=300' >> gki/common/arch/arm64/configs/gki_defconfig

      - name: Final Clean Tree Commit
        run: |
          cd gki/common
          git add .
          git commit -m "Final clean tree before build" || true

      - name: Build Kernel
        run: |
          cd gki
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Upload Image to PixelDrain
        if: always() 
        run: |
          if [ -f gki/out/android12-5.10/common/arch/arm64/boot/Image ]; then
            curl -u :23c84c82-ce06-4e35-bc1f-69eaa13b9958 \
              -F file=@gki/out/android12-5.10/common/arch/arm64/boot/Image \
              https://pixeldrain.com/api/file
          else
            echo "Image file not found. Build likely failed."
          fi
