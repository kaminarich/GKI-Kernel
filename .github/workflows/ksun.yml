name: KSUN 3 Fixed

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Custom Kernel Name (Optional)'
        required: false
        default: ''
        type: string
      clang_version:
        description: 'Select Clang Version'
        required: true
        type: choice
        options:
          - 'r536225 (Clang 19)'
          - 'r547379 (Clang 20)'
        default: 'r547379 (Clang 20)'

jobs:
  build:
    name: Build KSUN - ${{ github.event.inputs.clang_version }}
    runs-on: ubuntu-22.04

    steps:
      - name: Cleanup Workspace
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Configure Git Identity
        run: |
          git config --global user.name "kaminari"
          git config --global user.email "itawanri14@gmail.com"

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld

      - name: Initialize Repo (Google Structure)
        run: |
          mkdir gki && cd gki
          # Initialize Google repo to get build tools and prebuilts structure
          echo "Initializing Google repository..."
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc --all)

      - name: Swap Kernel Source (MillenniumOSS)
        working-directory: gki
        run: |
          # Remove the default Google kernel source
          echo "Removing default Google source..."
          rm -rf common
          
          # Clone MillenniumOSS source as replacement
          echo "Cloning MillenniumOSS..."
          git clone https://github.com/MillenniumOSS/android_kernel_common_android12-5.10.git common
          
          cd common
          # Add Rama's remote for updates/patches
          # echo "Adding upstream remote..."
          # git remote add rama https://github.com/ramabondanp/android_kernel_common-5.10.git
          # git fetch -j12 rama
          
          # Checkout to the target branch
          # git checkout -b update-5.10.247 rama/android12-5.10-staging

      - name: Setup Clang
        working-directory: gki
        run: |
          mkdir -p prebuilts-master/clang/host/linux-x86
          
          if [ "${{ github.event.inputs.clang_version }}" == "r536225 (Clang 19)" ]; then
            echo "Setting up Clang-19 (r536225)..."
            CLANG_VER="clang-r536225"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          else
            echo "Setting up Clang-20 (r547379)..."
            CLANG_VER="clang-r547379"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/62cdcefa89e31af2d72c366e8b5ef8db84caea62/clang-r547379.tar.gz"
          fi
          
          echo "CLANG_VER=$CLANG_VER" >> $GITHUB_ENV

          mkdir -p prebuilts-master/clang/host/linux-x86/$CLANG_VER
          cd prebuilts-master/clang/host/linux-x86
          curl -L "${CLANG_URL}" | tar -xz -C $CLANG_VER
          
          # Fix symlink for build script compatibility
          rm -rf clang-r416183b
          ln -sf $CLANG_VER clang-r416183b

      - name: Setup KernelSU-Next & SUSFS
        working-directory: gki/common
        run: |
          echo "Installing KernelSU-Next (Dev Profile)..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev
          
          echo "Cloning SUSFS..."
          git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
          rm -rf sus/.git
          
          echo "Applying SUSFS patches..."
          cp -r sus/kernel_patches/fs/* fs/
          cp -r sus/kernel_patches/include/* include/
          cp sus/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch .
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch || echo "Patch might be already applied, skipping..."

      - name: Apply Manual Fixes & Patches
        working-directory: gki/common
        run: |
          echo "Applying manual source code fixes..."

          # Fix Stack Protector logic for KSUN compatibility
          sed -i '/config STACKPROTECTOR_PER_TASK/{n;s/def_bool y/bool "Stack Protector per task"\n\tdefault y/;}' arch/arm64/Kconfig

          # Bypass Xiaomi Module Version Check
          sed -i '/pr_warn.*disagrees about version of symbol.*/,+1 s/.*/return 1;/' kernel/module.c
          
          # Fix DRM Atomic Check (Prevents bootloops on some devices)
          sed -i '/^static int drm_atomic_check_valid_clones/,/^}/d' drivers/gpu/drm/drm_atomic_helper.c
          sed -i '/ret = drm_atomic_check_valid_clones/,/return ret;/d' drivers/gpu/drm/drm_atomic_helper.c

          # Cherry-Pick Common Fixes from Rama
          echo "Cherry-picking common fixes..."
          curl -L "https://github.com/ramabondanp/android_kernel_common-5.10/commit/4fe04b60009e.patch" | git am -3 || {
             curl -L "https://github.com/ramabondanp/android_kernel_common-5.10/commit/4fe04b60009e.patch" | patch -p1
          }

      - name: Inject Configuration (Defconfig)
        working-directory: gki
        run: |
          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"
          
          # Disable check_defconfig to allow custom modifications
          sed -i 's/check_defconfig//' common/build.config.gki
          
          echo "Injecting custom configurations..."
          
          # Core KSUN & SUSFS Configs
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPM=n" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> $DEFCONFIG
          # echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> $DEFCONFIG
          
          # Disable Stack Protector per task (Conflict with KSU)
          echo "# CONFIG_STACKPROTECTOR_PER_TASK is not set" >> $DEFCONFIG
          
          # Network & Performance Configs
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $DEFCONFIG 
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG
          echo "CONFIG_DEFAULT_BBR=y" >> $DEFCONFIG
          
          # Set HZ to 300
          echo "CONFIG_HZ_300=y" >> $DEFCONFIG
          echo "CONFIG_HZ=300" >> $DEFCONFIG

      - name: Set Kernel Version
        working-directory: gki/common
        run: |
          KERNEL_NAME="${{ github.event.inputs.kernel_name }}"
          echo "Setting Local Version: $KERNEL_NAME"
          
          # Create dummy setlocalversion script to handle custom naming
          echo "" > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          
          if [ -n "$KERNEL_NAME" ]; then
             if grep -q '^EXTRAVERSION *=' Makefile; then
               sed -i "s/^EXTRAVERSION *=.*/EXTRAVERSION = -$KERNEL_NAME/" Makefile
             else
               echo "EXTRAVERSION = -$KERNEL_NAME" >> Makefile
             fi
          fi

      - name: Build Kernel
        working-directory: gki
        run: |
          export CC="ccache clang"
          export USE_CCACHE=1
          export CCACHE_DIR="/tmp/ccache"
          ccache -M 5G
          
          # Update build config with selected Clang version
          sed -i "s/clang-r[0-9]*[a-z]*/${CLANG_VER}/g" common/build.config.gki.aarch64
          sed -i "s/clang-r[0-9]*[a-z]*/${CLANG_VER}/g" common/build.config.common 2>/dev/null || true

          echo "Starting build process..."
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KSUN-Image-${{ github.event.inputs.kernel_name }}
          path: gki/out/**/dist/Image
          if-no-files-found: warn

      - name: Upload to PixelDrain
        if: always() 
        run: |
          echo "Uploading to PixelDrain..."
          if [ -f gki/out/android12-5.10/common/arch/arm64/boot/Image ]; then
            curl -u :23c84c82-ce06-4e35-bc1f-69eaa13b9958 \
              -F file=@gki/out/android12-5.10/common/arch/arm64/boot/Image \
              https://pixeldrain.com/api/file
          else
            echo "Build failed or Image not found, skipping upload."
          fi
