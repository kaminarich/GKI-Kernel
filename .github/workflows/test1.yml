name: Build GKI Kernel Image

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: 'Link Repository Kernel'
        required: true
        default: 'https://android.googlesource.com/kernel/common'
      KERNEL_BRANCH:
        description: 'Branch Kernel'
        required: true
        default: 'android12-5.10'
      KERNEL_DEFCONFIG:
        description: 'Nama Defconfig'
        required: true
        default: 'gki_defconfig'
      KSU_VARIANT:
        description: 'KernelSU Variant'
        required: true
        default: 'Suki'
        type: choice
        options:
        - Next
        - Suki
        - None
      ENABLE_SUSFS:
        description: 'Pasang SuSFS?'
        required: true
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup & Install Deps
      run: |
        # Hapus android tools bawaan agar lega
        sudo rm -rf /usr/local/lib/android
        
        # Install dependencies (Updated for Ubuntu 24.04 Noble)
        # Ditambah: clang, lld, llvm, gcc-aarch64-linux-gnu (Pengganti download manual)
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python3-pip aria2 jq libncurses-dev clang lld llvm gcc-aarch64-linux-gnu

    - name: Compile Kernel
      run: |
        # --- VARIABLE KONFIGURASI ---
        export KERNEL_NAME="-Aetherium💠2.4-Genesis"
        export KERNEL_REPO="${{ inputs.KERNEL_REPO }}"
        export KERNEL_BRANCH="${{ inputs.KERNEL_BRANCH }}"
        export KERNEL_DEFCONFIG="${{ inputs.KERNEL_DEFCONFIG }}"
        export KSU="${{ inputs.KSU_VARIANT }}"
        export KSU_SUSFS="${{ inputs.ENABLE_SUSFS }}"
        
        WORKDIR=$(pwd)
        mkdir -p $WORKDIR/out

        # 1. Clone Kernel Source
        echo "⬇️ Cloning Kernel Source ($KERNEL_BRANCH)..."
        git clone --depth=1 -q "$KERNEL_REPO" -b "$KERNEL_BRANCH" ksrc
        cd ksrc

        # 2. Setup KernelSU (Opsional)
        if [[ "$KSU" != "None" ]]; then
            echo "⚡ Setting up KernelSU: $KSU"
            rm -rf drivers/staging/kernelsu drivers/kernelsu KernelSU
            
            if [[ "$KSU" == "Next" ]]; then
                curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            elif [[ "$KSU" == "Suki" ]]; then
                curl -LSs "https://raw.githubusercontent.com/Wildan-Gremory/SukiSU/main/kernel/setup.sh" | bash -s main
            fi
        fi

        # 3. Setup SuSFS (Opsional)
        if [[ "$KSU_SUSFS" == "true" ]]; then
            echo "🛡️ Setting up SuSFS..."
            git clone --depth=1 -q -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu ../susfs
            # Copy patch file
            cp -R ../susfs/kernel_patches/fs/* ./fs/
            cp -R ../susfs/kernel_patches/include/* ./include/
        fi

        # 4. Build Process
        echo "🔨 Starting Build (using System Clang)..."
        export KBUILD_BUILD_USER="Aetherium"
        export KBUILD_BUILD_HOST="GitHub"
        
        # Setup Flags untuk System Clang
        # Tambah KCFLAGS=-Wno-error untuk menghindari stop karena warning compiler baru
        ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error"

        # Buat Config Awal
        make -j$(nproc) $ARGS $KERNEL_DEFCONFIG

        # --- MODIFIKASI CONFIG (NAMA KERNEL & FITUR) ---
        echo "✍️ Applying Config Tweaks & Name..."
        
        # Masukkan Nama Kernel
        $WORKDIR/ksrc/scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "$KERNEL_NAME"
        
        # Enable KSU di Config
        if [[ "$KSU" != "None" ]]; then 
            $WORKDIR/ksrc/scripts/config --file out/.config --enable CONFIG_KSU
        fi
        
        # Enable SuSFS di Config
        if [[ "$KSU_SUSFS" == "true" ]]; then 
            $WORKDIR/ksrc/scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
        fi

        # Compile IMAGE only
        make -j$(nproc) $ARGS Image

        # Ambil hasilnya
        if [[ -f out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image $WORKDIR/Image
            echo "✅ Image berhasil dibuat."
        else
            echo "❌ Gagal membuat file Image."
            exit 1
        fi

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Image-Aetherium
        path: Image
