name: Build GKI Aetherium3.01 KSU v2.1.2

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Setup git identity
        run: |
          git config --global user.name "kaminari"
          git config --global user.email "itawanri14@gmail.com"

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld

      - name: Create and Init GKI Source (Shallow)
        run: |
          mkdir gki && cd gki
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc --all)

      - name: Delete Line 2 in build.config.gki
        run: |
          sed -i '2d' gki/common/build.config.gki

      - name: Apply KernelSU v2.1.2 & SUSFS
        run: |
          cd gki/common
          
          # --- 1. Install KernelSU (Stable v2.1.2) ---
          # Menggunakan tag v2.1.2 secara eksplisit
          echo "Installing KernelSU v2.1.2..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v2.1.2

          # --- 2. Install SUSFS ---
          echo "Cloning SUSFS..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu -b gki-android12-5.10 susfs4ksu
          
          # Copy SUSFS files to kernel source
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/* include/
          
          # Apply SUSFS patch to Kernel
          patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          # --- 3. Patch KernelSU for SUSFS support ---
          echo "Patching KernelSU for SUSFS..."
          cd KernelSU
          # Note: Patch SUSFS biasanya dibuat berdasarkan logika kode main KSU.
          # Jika gagal di v2.1.2, kita mungkin perlu resolve conflict manual, 
          # tapi biasanya aman karena struktur kode inti jarang berubah drastis.
          patch -p1 < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          cd ..

      - name: Fix KernelSU and susfs directory state
        run: |
          cd gki/common
          # Hapus folder .git agar tidak dianggap sebagai submodule
          rm -rf KernelSU/.git
          rm -rf susfs4ksu/.git
          
          # Bersihkan index git
          git rm --cached --ignore-unmatch -r KernelSU
          git rm --cached --ignore-unmatch -r susfs4ksu
          
          # Tambahkan kembali sebagai file biasa
          git add KernelSU
          git add susfs4ksu
          git commit -m "Inject KernelSU v2.1.2 & SUSFS manually" || true

      - name: Apply Cherry-pick from Pzqqt
        run: |
          cd gki/common
          curl -L https://github.com/Pzqqt/android_kernel_xiaomi_marble/commit/477706c2bcaaf48350c61f9f6824e1e454617147.patch > custom_cherrypick.patch
          
          echo "Applying custom cherry-pick..."
          git apply -v custom_cherrypick.patch
          
          rm custom_cherrypick.patch
          git add .
          git commit -m "Apply cherry-pick: 477706c" || true

      - name: Add Custom Network & FS Configs
        run: |
          DEFCONFIG="gki/common/arch/arm64/configs/gki_defconfig"
          
          echo "Injecting custom configs to $DEFCONFIG"
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $DEFCONFIG 
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_BIC=n" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_HTCP=n" >> $DEFCONFIG 
          echo "CONFIG_DEFAULT_BBR=y" >> $DEFCONFIG

      - name: Set Kernel EXTRAVERSION
        run: |
          cd gki/common
          echo "" > scripts/setlocalversion
          chmod +x scripts/setlocalversion

          # Update nama kernel
          if grep -q '^EXTRAVERSION *=' Makefile; then
            sed -i 's/^EXTRAVERSION *=.*/EXTRAVERSION = -💠Aetherium3.0-Eclipse-KSU-SUSFS/' Makefile
          else
            echo 'EXTRAVERSION = -💠Aetherium3.0-Eclipse-KSU-SUSFS' >> Makefile
          fi

      - name: Append CONFIG_HZ_300 to defconfig
        run: |
          echo -e '\nCONFIG_HZ_300=y\nCONFIG_HZ=300' >> gki/common/arch/arm64/configs/gki_defconfig

      - name: Final Clean Tree Commit
        run: |
          cd gki/common
          git add .
          git commit -m "Final clean tree before build" || true

      - name: Build Kernel
        run: |
          cd gki
          # Set versi git manual karena .git dihapus
          # Angka 21002 biasanya merepresentasikan v2.1.2 di version code KSU (11849 + offset)
          # Agar aman kita pakai jumlah commit yang cukup tinggi atau kode statis
          export KSU_GIT_VERSION=21002
          
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Upload Image to PixelDrain
        if: always() 
        run: |
          if [ -f gki/out/android12-5.10/common/arch/arm64/boot/Image ]; then
            curl -u :23c84c82-ce06-4e35-bc1f-69eaa13b9958 \
              -F file=@gki/out/android12-5.10/common/arch/arm64/boot/Image \
              https://pixeldrain.com/api/file
          else
            echo "Image file not found. Build likely failed."
          fi
