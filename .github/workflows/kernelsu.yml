name: Build GKI Aetherium3.01 KSS (No Git Delete)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Setup git identity
        run: |
          git config --global user.name "kaminari"
          git config --global user.email "itawanri14@gmail.com"

      - name: Install Dependencies
        run: |
          # HANYA UPDATE, JANGAN UPGRADE
          sudo apt update
          sudo apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld

      - name: Create and Init GKI Source (Shallow)
        run: |
          mkdir gki && cd gki
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc --all)

      - name: Delete Line 2 in build.config.gki
        run: |
          sed -i '2d' gki/common/build.config.gki

      - name: Apply KernelSU (Official) & SUSFS
        run: |
          cd gki/common
          
          echo "Installing KernelSU..."
          # Clone biasa, JANGAN HAPUS .git nya
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

          echo "Installing SUSFS..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu -b gki-android12-5.10 susfs4ksu
          
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/* include/
          patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          echo "Patching KernelSU for SUSFS..."
          cd KernelSU
          patch -p1 < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          
          # Pastikan .git masih ada
          if [ -d ".git" ]; then
             echo "AMAN: Folder .git KernelSU masih ada."
          fi
          cd ..

      - name: Ignore KernelSU in Main Git
        run: |
          cd gki/common
          # Masukkan folder ke .gitignore biar git utama gak rewel
          # Jadi kita gak perlu hapus .git di dalamnya
          echo "KernelSU/" >> .gitignore
          echo "susfs4ksu/" >> .gitignore
          
          git add .gitignore
          git commit -m "Ignore KernelSU and SUSFS to keep their git history intact" || true

      - name: Apply Cherry-pick from Pzqqt
        run: |
          cd gki/common
          curl -L https://github.com/Pzqqt/android_kernel_xiaomi_marble/commit/477706c2bcaaf48350c61f9f6824e1e454617147.patch > custom_cherrypick.patch
          git apply -v custom_cherrypick.patch
          rm custom_cherrypick.patch
          git add .
          git commit -m "Apply cherry-pick: 477706c" || true

      - name: Add Custom Network & FS Configs
        run: |
          DEFCONFIG="gki/common/arch/arm64/configs/gki_defconfig"
          
          echo "Injecting custom configs"
          {
            echo "CONFIG_TMPFS_XATTR=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_IP_NF_TARGET_TTL=y"
            echo "CONFIG_IP6_NF_TARGET_HL=y"
            echo "CONFIG_IP6_NF_MATCH_HL=y"
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_TCP_CONG_BIC=n"
            echo "CONFIG_TCP_CONG_WESTWOOD=n"
            echo "CONFIG_TCP_CONG_HTCP=n"
            echo "CONFIG_DEFAULT_BBR=y"
          } >> $DEFCONFIG

      - name: Set Kernel EXTRAVERSION
        run: |
          cd gki/common
          echo "" > scripts/setlocalversion
          chmod +x scripts/setlocalversion

          if grep -q '^EXTRAVERSION *=' Makefile; then
            sed -i 's/^EXTRAVERSION *=.*/EXTRAVERSION = -💠Aetherium3.1-Eclipse-KSS/' Makefile
          else
            echo 'EXTRAVERSION = -💠Aetherium3.1-Eclipse-KSS' >> Makefile
          fi

      - name: Append CONFIG_HZ_300 to defconfig
        run: |
          echo -e '\nCONFIG_HZ_300=y\nCONFIG_HZ=300' >> gki/common/arch/arm64/configs/gki_defconfig

      - name: Final Clean Tree Commit
        run: |
          cd gki/common
          # Karena KernelSU udah di .gitignore, git add aman
          git add .
          git commit -m "Final clean tree before build" || true

      - name: Build Kernel
        run: |
          cd gki
          echo "Starting kernel build..."
          # Build jalan, versi KSU aman karena folder .git masih ada
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Upload Image to PixelDrain
        if: always()
        run: |
          IMG=gki/out/android12-5.10/common/arch/arm64/boot/Image
          if [ -f "$IMG" ]; then
            curl -u :23c84c82-ce06-4e35-bc1f-69eaa13b9958 \
              -F file=@"$IMG" \
              https://pixeldrain.com/api/file
          else
            echo "Image file not found. Build likely failed."
          fi
