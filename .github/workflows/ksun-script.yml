name: Script Build KSUN Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Kernel Name'
        required: true
        default: 'Aetherium3.3-Eclipse-KSN'
        type: string
      clang_version:
        description: 'Clang Version'
        required: true
        type: choice
        options:
          - '19'
          - '20'
        default: '19'

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Locate and Execute Script
        run: |
          echo "=== Locating ksun.sh script ==="
          
          # Find ksun.sh in the current directory tree
          SCRIPT_FILE=$(find . -type f -name "ksun.sh" | head -n 1)

          if [ -z "$SCRIPT_FILE" ]; then
            echo "Error: ksun.sh not found in the repository."
            echo "Please ensure the file exists in the selected branch."
            exit 1
          else
            echo "Script found at: $SCRIPT_FILE"
          fi

          # Grant execution permissions
          chmod +x "$SCRIPT_FILE"

          # Inject configuration variables
          echo "Configuring script variables..."
          sed -i 's/^KERNEL_NAME=".*"/KERNEL_NAME="${{ inputs.kernel_name }}"/' "$SCRIPT_FILE"
          sed -i 's/^CLANG_CHOICE=".*"/CLANG_CHOICE="${{ inputs.clang_version }}"/' "$SCRIPT_FILE"

          # Execute the script
          echo "Starting execution..."
          ./"$SCRIPT_FILE"

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-Image
          path: gki/out/android12-5.10/common/arch/arm64/boot/Image
