name: Build KSUN Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Kernel Name'
        required: true
        default: 'Aetherium3.3-Eclipse-KSN'
        type: string
      clang_version:
        description: 'Clang Version'
        required: true
        type: choice
        options:
          - '19'
          - '20'
        default: '19'

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Download and Execute Script
        run: |
          echo "=== Downloading Script from Raw URL ==="
          
          # Construct Raw URL based on repository and current branch
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/workflows/ksun.sh"
          
          echo "Target URL: $RAW_URL"
          
          # Download script using curl with authentication
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o ksun_run.sh -L "$RAW_URL"

          # Verify download status (check for 404 error)
          if grep -q "404: Not Found" ksun_run.sh; then
            echo "Error: Failed to download script. File not found in the current branch."
            echo "Please verify that '.github/workflows/ksun.sh' exists in branch: ${{ github.ref_name }}"
            exit 1
          fi

          echo "Script downloaded successfully."
          
          # Grant execution permissions
          chmod +x ksun_run.sh

          echo "=== Configuring Script Variables ==="
          # Inject user inputs into the script
          sed -i 's/^KERNEL_NAME=".*"/KERNEL_NAME="${{ inputs.kernel_name }}"/' ksun_run.sh
          sed -i 's/^CLANG_CHOICE=".*"/CLANG_CHOICE="${{ inputs.clang_version }}"/' ksun_run.sh

          echo "=== Executing Script ==="
          ./ksun_run.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-Image
          path: gki/out/android12-5.10/common/arch/arm64/boot/Image
