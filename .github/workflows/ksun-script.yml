name: 1 Build KSUN (Env Style)

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        required: true
        default: 'Aetherium3.3-Eclipse-KSN'
        type: string
      clang_version:
        required: true
        type: choice
        options:
          - '19'
          - '20'
        default: '19'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Prepare Script Location
        run: |
          # 1. Tentukan nama file (mirip TARGET_CONFIG_FILENAME)
          SCRIPT_NAME="ksun.sh"
          
          # 2. Tentukan lokasi folder (Sesuai screenshot lu: .github/workflows/)
          # Kita pakai $GITHUB_WORKSPACE biar path-nya absolut/pasti
          SCRIPT_DIR="$GITHUB_WORKSPACE/.github/workflows"
          
          # 3. Gabungin jadi satu path lengkap
          FULL_PATH="$SCRIPT_DIR/$SCRIPT_NAME"
          
          # 4. Cek file ada atau nggak (Safety check)
          if [ -f "$FULL_PATH" ]; then
              echo "✅ Script ditemukan di: $FULL_PATH"
              # Masukin ke GITHUB_ENV biar bisa dipanggil step berikutnya
              echo "KSUN_SCRIPT=$FULL_PATH" >> $GITHUB_ENV
          else
              echo "❌ Error: Script gak ketemu di $FULL_PATH"
              echo "Pastikan lu run di branch yang bener (update-sukisu)!"
              ls -R .github # Debugging bantu liat isi folder
              exit 1
          fi

      - name: Execute Script
        run: |
          # Panggil path dari environment variable yang kita buat di atas
          echo "Menjalankan script: ${{ env.KSUN_SCRIPT }}"
          
          # Kasih izin eksekusi
          chmod +x ${{ env.KSUN_SCRIPT }}
          
          # Inject variabel input ke dalam script
          sed -i 's/^KERNEL_NAME=".*"/KERNEL_NAME="${{ inputs.kernel_name }}"/' ${{ env.KSUN_SCRIPT }}
          sed -i 's/^CLANG_CHOICE=".*"/CLANG_CHOICE="${{ inputs.clang_version }}"/' ${{ env.KSUN_SCRIPT }}
          
          # Jalankan
          ${{ env.KSUN_SCRIPT }}

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-Image
          path: gki/out/android12-5.10/common/arch/arm64/boot/Image
