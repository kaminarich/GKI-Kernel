name: Build KSUN Script Fix

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Nama Kernel'
        required: true
        default: 'Aetherium3.3-Eclipse-KSN'
        type: string
      clang_version:
        description: 'Versi Clang'
        required: true
        type: choice
        options:
          - '19'
          - '20'
        default: '19'

jobs:
  build:
    name: Build ${{ inputs.kernel_name }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Execute Script
        run: |
          # 1. Tentukan lokasi file (sesuai screenshot kamu)
          SCRIPT_PATH=".github/workflows/ksun.sh"
          
          echo "=== Debug: Cek apakah file ada ==="
          ls -l "$SCRIPT_PATH" || echo "File gak ketemu di $SCRIPT_PATH"
          
          # 2. Beri izin eksekusi
          chmod +x "$SCRIPT_PATH"
          
          # 3. Inject settingan dari GitHub Actions ke dalam Script
          sed -i 's/^KERNEL_NAME=".*"/KERNEL_NAME="${{ inputs.kernel_name }}"/' "$SCRIPT_PATH"
          sed -i 's/^CLANG_CHOICE=".*"/CLANG_CHOICE="${{ inputs.clang_version }}"/' "$SCRIPT_PATH"
          
          # 4. Jalankan Scriptnya
          ./"$SCRIPT_PATH"

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-Image
          path: gki/out/android12-5.10/common/arch/arm64/boot/Image
